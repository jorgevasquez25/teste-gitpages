site_name: SIGMA
site_description: SIGMA — Sistema Integrado de Gestão de Matrículas
site_url: https://jorgevasquez25.github.io/teste-gitpages/
repo_url: https://github.com/jorgevasquez25/teste-gitpages
repo_name: teste-gitpages
copyright: SIGMA · Os Requisitados · Requisitos de Software (FGA-0313) · UnB

theme:
  name: material
  language: pt-BR
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para o modo claro
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para o modo escuro
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/sigma.css

extra_javascript:
  - javascripts/sigma.js

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Visão do Produto e Projeto:
      - visao/index.md
      - 1. Cenário Atual: visao/cenario-atual.md
      - 2. Solução Proposta: visao/solucao-proposta.md
      - 3. Intervenção Social: visao/intervencao-social.md
      - 4. Estratégias: visao/estrategias.md
      - 5. Engenharia de Requisitos: visao/engenharia-requisitos.md
      - 6. Cronograma e Entregas: visao/cronograma.md
      - 7. Interação Equipe e Cliente: visao/interacao.md
      - 11. Lições Aprendidas: visao/licoes-aprendidas.md
  - Requisitos:
      - requisitos/index.md
      - Requisitos Funcionais: requisitos/funcionais.md
      - Requisitos Não Funcionais: requisitos/nao-funcionais.md
      - Decisão dos Feedbacks: requisitos/feedbacks.md
      - Priorização: requisitos/priorizacao.md
      - MVP: requisitos/mvp.md
  - Atividades: atividades.md
  - Atas de Reunião: atas.md
  - Entrega de vídeos: videos.md
  - Referências: referencias.md
